# XrayR-style: ./config on the host is mounted to /etc/xboard-node in the container.
# Run all commands from this directory: cd compose && docker compose up -d
# See README.md in this folder.

services:
  xboard-node:
    image: ghcr.io/icodex/xboard-node:latest
    container_name: xboard-node
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./config:/etc/xboard-node
    command: ["-c", "/etc/xboard-node/config.yml"]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # Optional: override panel settings without editing config.yml (still need a valid config file to load).
    # environment:
    #   API_HOST: https://panel.example.com
    #   API_KEY: your-server-token
    #   NODE_ID: "1"
    #   KERNEL_TYPE: singbox
